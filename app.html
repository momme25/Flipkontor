  {title:"Fertig!", text:"Viel Erfolg beim Flippen. Das Tutorial findest du jederzeit in den Einstellungen unter „Hilfe“."}
];
let tourI = -1, tourSteps = [];
const tourActive = () => S.items.some(i => i.status === "lager" || i.status === "gelistet");
const tourSeen = () => { try { return !!localStorage.getItem("fk-tour"); } catch(e){ return true; } };
function startTour(force){
  if (!force && tourSeen()) return;
  if (dlg.open) closeDlg(true);
  try { localStorage.setItem("fk-tour", "1"); } catch(e){}
  tourSteps = TOUR.filter(st => !st.when || st.when()); tourI = 0;
  let el = $("#tour");
  if (!el){
    el = document.createElement("div"); el.id = "tour"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-live", "polite");
    el.innerHTML = `<div class="tour-spot" aria-hidden="true"></div><div class="tour-card" tabindex="-1"></div>`;
    document.body.append(el);
    el.addEventListener("click", ev => { const b = ev.target.closest("[data-tour]"); if (!b) return; ev.stopPropagation();
      const a = b.dataset.tour; if (a === "next") tourGo(tourI + 1); if (a === "back") tourGo(tourI - 1, -1); if (a === "skip") endTour(); });
    addEventListener("resize", () => { if (tourI >= 0) tourPlace(); });
    addEventListener("keydown", ev => { if (tourI < 0) return; if (ev.key === "Escape") endTour(); if (ev.key === "ArrowRight") tourGo(tourI + 1); if (ev.key === "ArrowLeft") tourGo(tourI - 1, -1); });
  }
  el.hidden = false; document.documentElement.classList.add("touring"); $("#fab")?.classList.remove("away");
  tourGo(0);
}
function endTour(){ tourI = -1; const el = $("#tour"); if (el) el.hidden = true; document.documentElement.classList.remove("touring"); }
function tourGo(i, dir = 1){
  if (i < 0) return;
  if (i >= tourSteps.length){ endTour(); return; }
  const st = tourSteps[i];
  if (st.tab && st.tab !== S.tab){ setTab(st.tab); if (st.tab === "lager") S.filter = {status:"aktiv", q:""}; render(); window.scrollTo(0, 0); }
  if (st.sel && !document.querySelector(st.sel)){ tourGo(i + dir, dir); return; }
  tourI = i;
  const t = st.sel && document.querySelector(st.sel);
  if (t){ const r = t.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight - 160) window.scrollTo(0, Math.max(0, scrollY + r.top - innerHeight * 0.3)); }
  const shown = tourSteps.length, pos = i + 1;
  const last = i === tourSteps.length - 1;
  $("#tour .tour-card").innerHTML = `<span class="tour-n muted small num">${pos} von ${shown}</span><h3>${esc(st.title)}</h3><p>${esc(st.text)}</p>
    <div class="tour-b">${last ? "" : `<button type="button" class="btn ghost sm" data-tour="skip">Überspringen</button>`}<span class="grow"></span>${i > 0 ? `<button type="button" class="btn sm" data-tour="back">Zurück</button>` : ""}<button type="button" class="btn primary sm" data-tour="next">${last ? "Los geht's" : "Weiter"}</button></div>`;
  requestAnimationFrame(tourPlace);
  $("#tour .tour-card").focus({preventScroll:true});
}
function tourPlace(){
  const st = tourSteps[tourI]; if (!st) return;
  const spot = $("#tour .tour-spot"), card = $("#tour .tour-card"), t = st.sel && document.querySelector(st.sel);
  const W = innerWidth, H = innerHeight, cw = Math.min(360, W - 32);
  card.style.width = cw + "px";
  if (!t){ spot.style.cssText = "left:50%;top:50%;width:0;height:0"; card.style.left = (W - cw) / 2 + "px"; card.style.top = Math.max(16, (H - card.offsetHeight) / 2) + "px"; return; }
  const r = t.getBoundingClientRect(), pad = 6;
  const rad = Math.min(parseFloat(getComputedStyle(t).borderTopLeftRadius) || 8, r.height / 2) + pad;
  spot.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px;border-radius:${rad}px`;
  const ch = card.offsetHeight, below = r.bottom + pad + 12, above = r.top - pad - 12 - ch;
  const top = below + ch <= H - 12 ? below : above >= 12 ? above : Math.max(12, H - ch - 12);
  card.style.top = top + "px";

function csv(){
  const head = ["Nummer","Bezeichnung","Marke","Kategorie","Größe","Zustand","Quelle","Supplier","Status","Einkauf","Gekauft am","Angebotspreis","Online seit","Verkauft für","Verkauft am","Versendet am","Abgeschlossen am","Versand","Gebühr","Gewinn","Lagerort","Sterne","Bewertung","Käufer"];
  const q = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const dec = v => v==="" || v==null ? "" : n(v).toFixed(2).replace(".",",");
  const rows = S.items.map(i => [i.code,i.name,i.brand,i.category,i.size,i.condition,i.source,i.supplierName,STATUS[i.status],dec(i.buyPrice),i.buyDate,dec(i.listPrice),i.listedAt,dec(i.sellPrice),i.sellDate,i.shippedAt,i.completedAt,dec(i.shipCost),SOLD(i.status)?dec(itemFee(i)):"",SOLD(i.status)?dec(itemProfit(i)):"",i.location,i.review?.stars,i.review?.text,i.review?.buyer].map(q).join(";"));
  const ex = ["","Ausgaben","Datum;Kategorie;Betrag;Topf;Notiz", ...S.expenses.map(e => [e.date,e.category,dec(e.amount),S.settings.pots.find(p=>p.id===resolvePot(e.pot))?.name,e.note].map(q).join(";"))];
  return "﻿" + [head.join(";"), ...rows, ...ex].join("\r\n");
}

/* Mehrere Artikel auf einmal ändern (Bündel), mit einem Rückgängig für alle */
async function applyMany(pairs, msg){
  if (!pairs.length) return;
  const prevs = pairs.map(([it]) => JSON.parse(JSON.stringify(S.items.find(i => i.id === it.id) || it)));
  const nexts = pairs.map(([it, ch]) => { const nx = {...JSON.parse(JSON.stringify(it)), ...ch}; for (const k in ch) if (ch[k] === undefined) delete nx[k]; return nx; });
  toast(msg, () => safe((async () => { for (const pv of prevs) await store.put("items", pv); })(), "Rückgängig gemacht"), true);
  try { for (const nx of nexts) await store.put("items", nx); }
  catch(e){ await safe(Promise.reject(e)); }
}
/* Ein Schritt in der Checkliste: speichern, Toast mit Rückgängig (stellt den vorherigen Stand samt Zeitstempeln wieder her) */
async function applyStep(id, base, changes, msg){
  const prev = JSON.parse(JSON.stringify(S.items.find(i => i.id === id) || base));
  const next = {...JSON.parse(JSON.stringify(base)), ...changes};
  for (const k in changes) if (changes[k] === undefined) delete next[k];
  const done = store.put("items", next);
  toast(msg, () => safe(store.put("items", prev), "Rückgängig gemacht"), true);
  requestAnimationFrame(() => { const el = document.getElementById("item-" + id); if (el && !el.dataset.leaving){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1000); } });
  try { await done; }
  catch(e){ await safe(Promise.reject(e)); }
}
function stepFor(it){
  switch (it.status){
    case "lager":
      if (it.listPrice === "" || it.listPrice == null || !n(it.listPrice)) priceSheet(it);
      else return applyStep(it.id, it, {status:"gelistet", listedAt:today()}, "Online gestellt");
      break;
    case "gelistet": sellDialog(it); break;
    case "verkauft":
      if (it.bundleId && bundleOf(it).length > 1) return applyMany(bundleOf(it).filter(i => i.status === "verkauft").map(i => [i, {status:"versendet", shippedAt:today()}]), "Bündel versendet");
      return applyStep(it.id, it, {status:"versendet", shippedAt:today()}, "Versendet"); break;
    case "versendet": reviewSheet(it, true); break;

function shrink(file){
  const draw = (img, res) => {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) throw new Error("leer");
    const max = 420, k = Math.min(1, max/Math.max(w,h));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w*k)); c.height = Math.max(1, Math.round(h*k));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.72));
  };
  const viaReader = () => new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => { try { draw(img, res); } catch(e){ rej(e); } }; img.src = r.result; };
    r.readAsDataURL(file);
  });
  if (!window.URL?.createObjectURL) return viaReader();
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { try { draw(img, res); } catch(e){ rej(e); } finally { URL.revokeObjectURL(url); } };
    img.onerror = () => { URL.revokeObjectURL(url); viaReader().then(res, rej); };
    img.src = url;
  });
}

function enhanceDate(inp){

const isNumField = el => el.tagName === "INPUT" && (!!el.dataset.num || /^(decimal|numeric)$/.test(el.getAttribute("inputmode") || ""));

/* ---------- Eigenes Zahlenfeld ---------- */
const KEY_LABEL = {"1":"Eins","2":"Zwei","3":"Drei","4":"Vier","5":"Fünf","6":"Sechs","7":"Sieben","8":"Acht","9":"Neun","0":"Null",",":"Komma","del":"Löschen"};
const DEL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>';
const np = document.createElement("div");
np.id = "np"; np.className = "np"; np.hidden = true;
np.innerHTML = `<div class="np-head" id="np-title"></div><div class="np-chips" id="np-chips"></div>
  <div class="np-grid">${["1","2","3","4","5","6","7","8","9",",","0","del"].map(k => `<button type="button" class="np-key" data-k="${k}" aria-label="${KEY_LABEL[k]}">${k === "del" ? DEL_ICON : k}</button>`).join("")}</div>
  <button type="button" class="btn primary np-next" id="np-next">Weiter</button><span class="sr-only" aria-live="polite" id="np-live"></span>`;

let npField = null, npCaret = null, npHold = null, npSkip = false;
const measure = document.createElement("canvas").getContext("2d");
const npScope = f => f.closest("dialog") || $("#app");
const npFields = scope => [...scope.querySelectorAll("input[data-num]")].filter(x => x.getClientRects().length);

function npApply(cur, key, isInt){
  const s = String(cur ?? "");
  if (key === "del") return s.slice(0, -1);
  if (key === ","){ if (isInt || s.includes(",")) return s; return (s === "" || s === "-" ? s + "0" : s) + ","; }
  const [a, b] = s.split(",");
  if (b !== undefined) return b.length >= 2 ? s : s + key;
  if (a.replace("-", "").length >= 6) return s;
  const neg = a.startsWith("-") ? "-" : "";
  const digits = (a.replace("-", "") + key).replace(/^0+(?=\d)/, "");
  return neg + digits;
}
const npFmt = x => Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0$/, "").replace(".", ",");
function npSet(v){
  const f = npField; if (!f) return;
  f.value = v;
  f.dispatchEvent(new Event("input", {bubbles:true}));

}
function placeCaret(){
  if (!npField) return;
  const f = npField, host = f.parentElement;
  if (!npCaret || npCaret.parentElement !== host){ npCaret?.remove(); npCaret = document.createElement("span"); npCaret.className = "np-caret"; host.append(npCaret); }
  const cs = getComputedStyle(f);
  measure.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const pl = parseFloat(cs.paddingLeft), pr = parseFloat(cs.paddingRight), bl = parseFloat(cs.borderLeftWidth), br = parseFloat(cs.borderRightWidth);
  const w = Math.min(measure.measureText(f.value).width, f.clientWidth - pl - pr);
  const right = cs.textAlign === "right" || cs.textAlign === "end";
  const x = right ? f.offsetLeft + f.offsetWidth - br - pr + 1 : f.offsetLeft + bl + pl + w + 1;
  npCaret.style.left = x + "px";
  npCaret.style.top = (f.offsetTop + f.offsetHeight / 2 - 11) + "px";
}
function npOpen(f){
  if (!f || !f.isConnected) return;
  if (npField === f && !np.hidden) return;
  if (npField) npField.classList.remove("np-field");
  npField = f; f.classList.add("np-field"); f.blur();
  const d = f.closest("dialog");
  if (d){ const box = d.querySelector(".dlg"); box.insertBefore(np, box.querySelector(".dlg-f")); np.classList.remove("np-solo"); document.body.classList.remove("np-open"); }
  else { document.body.append(np); np.classList.add("np-solo"); document.body.classList.add("np-open"); }
  const label = fieldLabel(f);
  $("#np-title").textContent = label;
  const euro = /€/.test(label), sell = f.id === "f-sellPrice" || f.id === "s-price";
  const chips = $("#np-chips");
  chips.innerHTML = euro ? ["1","5","10"].map(v => `<button type="button" class="np-chip" data-add="${v}">+${v} €</button>`).join("") + (sell ? `<button type="button" class="np-chip" data-listprice="1">= Angebotspreis</button>` : "") : "";
  chips.hidden = !euro;
  np.querySelector('[data-k=","]').disabled = f.dataset.num === "int";
  const list = npFields(npScope(f));
  $("#np-next").textContent = list.indexOf(f) < list.length - 1 ? "Weiter" : "Fertig";
  if (np.hidden){ np.hidden = false; np.classList.remove("np-show"); void np.offsetWidth; np.classList.add("np-show"); }
  placeCaret();
  setTimeout(() => { placeCaret(); f.scrollIntoView({block:"center", behavior: RM() ? "auto" : "smooth"}); }, 60);
}
function npClose(){
  if (npField) npField.classList.remove("np-field");
  npField = null; npCaret?.remove(); npCaret = null;
  np.hidden = true; np.classList.remove("np-show");
  document.body.classList.remove("np-open");
}
np.addEventListener("click", ev => {
  if (ev.target.closest("#np-next")){
    const list = npFields(npScope(npField || $("#app"))), nx = list[list.indexOf(npField) + 1];

  }

  if (c){
    if (c.dataset.add) npSet(npFmt(Math.round((n(npField.value) + +c.dataset.add) * 100) / 100));
    else npSet(npFmt(npField.id === "s-price" ? n(sheetItem?.listPrice) : n($("#f-listPrice")?.value)));
  }
});
np.addEventListener("pointerdown", ev => {

});
["pointerup", "pointercancel", "pointerleave"].forEach(t => np.addEventListener(t, () => clearTimeout(npHold)));
/* Antippen: Zahlenfeld öffnen, alles andere schließt es */
document.addEventListener("click", ev => {

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-fk]"); if (!t) return;
  const act = t.dataset.fk;
  if (act === "backup"){ download(`flipkontor-backup-${today()}.json`, backupJson(), "application/json"); mem.set("backup-at", Date.now()); toast("Backup gespeichert", null, true); if (S.tab === "start") render(); }
  if (act === "backup-later"){ mem.set("backup-snooze", Date.now() + 3 * 864e5); render(); }
  if (act === "news-ok") hideGate();
  if (act === "news-tour"){ hideGate(); setTimeout(() => startTour(true), 200); }
  if (act === "logout") await logout();
  if (act === "login") showLogin();
  if (act === "plans") showPlans(false);
  if (act === "delete"){
    const w = $("#fk-del");
    w.innerHTML = `<span class="small">Wirklich alles löschen?</span> <button class="btn danger sm" data-fk="delete-yes">Ja, Konto löschen</button> <button class="btn ghost sm" data-fk="delete-no">Abbrechen</button>`;
  }
  if (act === "delete-no") render();
  if (act === "delete-yes"){
    t.disabled = true;
    const { error } = await sb.functions.invoke("delete-account", {method:"POST"});
    if (error){ toast("Löschen fehlgeschlagen. Bitte melde dich beim Support."); t.disabled = false; return; }
    try { localStorage.removeItem(cacheKey()); } catch(e){}
    await sb.auth.signOut(); toast("Dein Konto wurde gelöscht", null, true);
  }
  if (act === "restore-yes"){
    const data = restoreBackup._pending; restoreBackup._pending = null;
    try { await restoreBackup(data); toast("Backup geladen", null, true); }
    catch(e){ toast(e?.message === "format" ? "Diese Datei ist kein Flipkontor-Backup." : "Speichern fehlgeschlagen"); }
    render();
  }
  if (act === "restore-no"){ restoreBackup._pending = null; render(); }
});
document.addEventListener("change", async ev => {
  if (ev.target.id !== "fk-restore" || !ev.target.files?.[0]) return;
  try {
    const data = JSON.parse(await ev.target.files[0].text());
    if (data?.app !== "flipkontor") throw 0;
    restoreBackup._pending = data;
    $("#fk-restore-q").innerHTML = `<div class="note warn" style="margin-top:8px">Backup vom ${fmtD(data.exportedAt)} mit ${data.items.length} Artikeln laden? Deine aktuellen Daten werden dabei ersetzt.<div class="row" style="margin-top:8px"><button class="btn danger sm" data-fk="restore-yes">Backup laden</button><button class="btn ghost sm" data-fk="restore-no">Abbrechen</button></div></div>`;
  } catch(e){ toast("Diese Datei ist kein Flipkontor-Backup."); }
  ev.target.value = "";
});

/* ---------- Erinnerung ans Backup (Daten liegen nur im Browser) ---------- */
const BACKUP_DAYS = 7;
function backupDue(){
  if (S.mode !== "local" || S.settings.demo || !S.items.length) return 0;
  const last = Number(mem.get("backup-at") || mem.get("first-seen") || Date.now());
  if (Number(mem.get("backup-snooze") || 0) > Date.now()) return 0;
  const days = Math.floor((Date.now() - last) / 864e5);
  return days >= BACKUP_DAYS ? days : 0;
}
const baseViewStart = viewStart;
viewStart = function(){
  const html = baseViewStart(), days = backupDue();
  if (!days) return html;
  const ever = !!mem.get("backup-at");
  return `<div class="note warn fk-bk" id="fk-bk"><b>Zeit für ein Backup</b><span>${ever ? `Dein letztes Backup ist ${days} Tage alt.` : "Du hast noch kein Backup gemacht."} Deine Daten liegen nur auf diesem Gerät.</span>
    <div class="row"><button class="btn primary sm" data-fk="backup">Backup speichern</button><button class="btn ghost sm" data-fk="backup-later">Später</button></div></div>` + html;
};

/* ---------- Speicher-Adapter: gleiche Schnittstelle wie bisher (collection/doc/set/delete) ---------- */
function mapErr(error){
  if (!error) return null;
  if (error.code === "42501"){ refreshProfile(true); return {code:"no_access", message:error.message}; }
  if (/JWT|token/i.test(error.message || "")) return {code:"unavailable", message:error.message};
  return {code:"unavailable", message:error.message};
}
function saveCache(){ try { localStorage.setItem(cacheKey(), JSON.stringify({items:S.items, expenses:S.expenses, settings:S.settings})); } catch(e){} }
async function upsert(coll, id, data){
  const { error } = await sb.from("docs").upsert({user_id:uid, coll, id, data, updated_at:new Date().toISOString()}, {onConflict:"user_id,coll,id"});
  if (error) throw mapErr(error);
  saveCache();
}
const cloudBase = {
  collection: coll => ({ doc: id => ({
    set: data => upsert(coll, id, data),
    delete: async () => { const { error } = await sb.from("docs").delete().match({user_id:uid, coll, id}); if (error) throw mapErr(error); saveCache(); }
  }) }),
  set: data => upsert("settings", "main", data)
};

async function fetchAll(){
  const rows = [];
  for (let from = 0; ; from += 1000){
    const { data, error } = await sb.from("docs").select("coll,id,data").order("coll").order("id").range(from, from + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  const out = {items:[], expenses:[], settings:null};
  for (const r of rows){
    if (r.coll === "settings") out.settings = r.data;
    else if (r.coll === "items" || r.coll === "expenses") out[r.coll].push({...r.data, id:r.id});
  }
  return out;
}

/* Daten, die schon im Browser liegen (Testphase), einmalig ins Konto übernehmen */
function localLegacy(){
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (d && !d.settings?.demo && ((d.items || []).length || (d.expenses || []).length)) return d;
  } catch(e){}
  return null;
}
async function migrate(d){
  const rows = [
    ...(d.items || []).map(i => { const {id, ...data} = i; return {user_id:uid, coll:"items", id, data}; }),
    ...(d.expenses || []).map(x => { const {id, ...data} = x; return {user_id:uid, coll:"expenses", id, data}; }),
    {user_id:uid, coll:"settings", id:"main", data:normSettings(d.settings)}
  ];
  for (let i = 0; i < rows.length; i += 200){
    const { error } = await sb.from("docs").upsert(rows.slice(i, i + 200), {onConflict:"user_id,coll,id"});
    if (error) throw error;
  }
}

/* ---------- Zugang ---------- */
async function refreshProfile(showWall){
  const { data } = await sb.from("profiles").select("*").maybeSingle();
  if (data) profile = data;
  const acc = accessInfo();
  if (!acc.ok && showWall !== false) showPlans(true);
  else if (acc.ok && gate.dataset.wall === "1") { hideGate(); delete gate.dataset.wall; }
  if (S.tab === "setup") render();
  return acc;
}
function checkoutUrl(base){
  const u = new URL(base);
  u.searchParams.set("checkout[email]", email);
  u.searchParams.set("checkout[custom][user_id]", uid);
  return u.toString();
}
function showPlans(blocking){
  const c = CFG.checkout || {}, p = CFG.prices || {};
  const plan = (key, title, sub, hi) => c[key] ? `<a class="fk-plan ${hi ? "hi" : ""}" href="${escH(checkoutUrl(c[key]))}" target="_blank" rel="noopener"><span><b>${title}</b><small>${sub}</small></span><span class="fk-price">${escH(p[key] || "")}</span></a>` : "";
  const acc = accessInfo();
  showGate(`${LOGO}<h2>${blocking ? "Deine Probezeit ist vorbei" : "Zugang kaufen"}</h2>
    <p>${blocking ? "Deine Daten bleiben gespeichert. Wähle einen Zugang, um weiterzumachen." : escH(acc.text)}</p>
    <div class="fk-plans">${CFG.showLifetime ? plan("lifetime", "Gründer-Zugang", "Einmal zahlen, für immer nutzen", true) : ""}${plan("yearly", "Jährlich", "2 Monate geschenkt", !CFG.showLifetime)}${plan("monthly", "Monatlich", "Jederzeit kündbar")}</div>
    <p class="small" style="white-space:normal">Nach dem Bezahlen kommst du hierher zurück und tippst auf „Ich habe bezahlt“.</p>
    <div class="fk-row"><button class="btn primary" data-gate="paid">Ich habe bezahlt</button>${blocking ? "" : `<button class="btn ghost" data-gate="close">Schließen</button>`}</div>
    ${blocking ? `<div class="fk-row"><button class="fk-link" data-gate="export">Daten als Backup sichern</button><button class="fk-link" data-gate="logout">Abmelden</button></div>` : ""}
    ${CFG.supportEmail ? `<p class="small">Fragen? ${escH(CFG.supportEmail)}</p>` : ""}`);
  gate.dataset.wall = blocking ? "1" : "";
}

/* ---------- Anmeldung per E-Mail-Code ---------- */
function showLogin(msg){
  showGate(`${LOGO}<h2>Willkommen bei Flipkontor</h2>
    <p>Melde dich mit deiner E-Mail an. Du bekommst einen Code, ein Passwort brauchst du nicht. ${CFG.freeMode ? "Die Testphase ist kostenlos." : `Neue Konten starten mit ${CFG.trialDays || 14} Tagen kostenlos.`}</p>
    <form id="fk-login" class="stack" novalidate>
      <div class="fld"><label for="fk-mail">E-Mail</label><input id="fk-mail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" enterkeyhint="send" required value="${escH(email)}" placeholder="du@beispiel.de"></div>
      <p class="fk-err" id="fk-err" role="alert">${escH(msg || "")}</p>
      <button class="btn primary" type="submit">Code senden</button>
    </form>
    <div class="fk-row"><button class="fk-link" data-gate="demo">Erst ansehen mit Beispieldaten</button></div>
    <p class="small fk-legal">Mit der Anmeldung akzeptierst du die <a href="nutzungsbedingungen.html" target="_blank">Nutzungsbedingungen</a>. Infos zum <a href="datenschutz.html" target="_blank">Datenschutz</a> · <a href="impressum.html" target="_blank">Impressum</a></p>`);
  setTimeout(() => $("#fk-mail")?.focus(), 50);
}
function showCode(){
  showGate(`${LOGO}<h2>Code eingeben</h2>
    <p>Wir haben dir einen Code an <b>${escH(email)}</b> geschickt. Schau auch im Spam-Ordner nach.</p>
    <form id="fk-verify" class="stack" novalidate>
      <div class="fld"><label for="fk-code">Code aus der E-Mail</label><input id="fk-code" class="fk-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="8" enterkeyhint="done" required></div>
      <p class="fk-err" id="fk-err" role="alert"></p>
      <button class="btn primary" type="submit">Anmelden</button>
    </form>
    <div class="fk-row"><button class="fk-link" data-gate="resend">Neuen Code senden</button><button class="fk-link" data-gate="back">Andere E-Mail</button></div>`);
  setTimeout(() => $("#fk-code")?.focus(), 50);
}
async function sendCode(){
  const err = $("#fk-err"), btn = gate.querySelector("button[type=submit]");
  email = ($("#fk-mail")?.value || email).trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ if (err) err.textContent = "Bitte gib eine gültige E-Mail-Adresse ein."; return; }
  if (btn){ btn.disabled = true; btn.textContent = "Wird gesendet …"; }
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
  if (error){
    if (btn){ btn.disabled = false; btn.textContent = "Code senden"; }
    if (err) err.textContent = error.status === 429 ? "Zu viele Versuche. Warte bitte eine Minute." : "Der Code konnte nicht gesendet werden. Prüf die E-Mail-Adresse.";
    return;
  }
  showCode();
}
async function verifyCode(){
  const err = $("#fk-err"), btn = gate.querySelector("button[type=submit]");
  const token = ($("#fk-code")?.value || "").replace(/\D/g, "");
  if (token.length < 6){ err.textContent = "Der Code hat mindestens 6 Ziffern."; return; }
  btn.disabled = true; btn.textContent = "Anmelden …";
  const { data, error } = await sb.auth.verifyOtp({ email, token, type:"email" });
  if (error || !data?.session){
    btn.disabled = false; btn.textContent = "Anmelden";
    err.textContent = "Der Code stimmt nicht oder ist abgelaufen.";
    return;
  }
  await signedIn(data.session);
}
gate.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "fk-login") sendCode();
  if (ev.target.id === "fk-verify") verifyCode();
});
gate.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-gate]"); if (!t) return;
  const a = t.dataset.gate;
  if (a === "back") showLogin();
  if (a === "resend"){ await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } }); toast("Neuer Code ist unterwegs", null, true); }
  if (a === "demo"){ hideGate(); store.useLocal(); }
  if (a === "close"){ hideGate(); }
  if (a === "paid"){ const acc = await refreshProfile(false); if (acc.ok){ hideGate(); toast("Danke! Dein Zugang ist aktiv.", null, true); } else toast("Die Zahlung ist noch nicht angekommen. Versuch es in einer Minute noch einmal."); }
  if (a === "export"){ download(`flipkontor-backup-${today()}.json`, backupJson(), "application/json"); mem.set("backup-at", Date.now()); }
  if (a === "logout") await logout();
});

/* ---------- Nach dem Anmelden ---------- */
async function signedIn(session){
  uid = session.user.id; email = session.user.email || email;
  hideGate();
  S.mode = "db"; store.base = cloudBase;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(cacheKey()) || "null"); } catch(e){}
  if (cached){ S.items = cached.items || []; S.expenses = cached.expenses || []; S.settings = normSettings(cached.settings); S.ready = true; }
  else { S.items = []; S.expenses = []; S.settings = normSettings({}); S.ready = false; }
  render();
  try {
    let d = await fetchAll();
    if (!d.items.length && !d.expenses.length && !d.settings){
      const legacy = localLegacy();
      if (legacy){ await migrate(legacy); d = await fetchAll(); toast("Deine bisherigen Daten wurden in dein Konto übernommen", null, true); }
    }
    S.items = d.items; S.expenses = d.expenses; S.settings = normSettings(d.settings || {});
    S.ready = true; saveCache(); render();
  } catch(e){
    if (!cached){ S.ready = true; render(); }
    toast("Keine Verbindung. Du siehst den zuletzt geladenen Stand.");
  }
  const acc = await refreshProfile(true);
  if (acc.ok && acc.trial && acc.days <= 3) toast(`Deine Probezeit endet in ${acc.days} ${acc.days === 1 ? "Tag" : "Tagen"}`);
}
async function logout(){
  try { localStorage.removeItem(cacheKey()); } catch(e){}
  await sb.auth.signOut();
}
function signedOut(){
  uid = null; profile = null;
  S.items = []; S.expenses = []; S.settings = normSettings({}); S.mode = "loading"; S.ready = false;
  showLogin();
}

/* Demo-Ansicht: Weg zurück zur Anmeldung */
const baseRenderDemo = renderDemo;
renderDemo = function(){
  baseRenderDemo();
  const pb = document.querySelector("#demo-pop .pop-b");
  if (pb && !uid && !pb.querySelector("[data-fk=login]")) pb.insertAdjacentHTML("beforeend", `<button class="btn primary sm" data-fk="login">Konto erstellen</button>`);
};

sb.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") signedOut();
  if (event === "TOKEN_REFRESHED" && session && !uid) signedIn(session);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && uid) refreshProfile(true); });

/* ---------- Start ---------- */
renderTabs();
sb.auth.getSession().then(({ data }) => {
  if (data?.session) signedIn(data.session);
  else showLogin();
});
})();
</script>
